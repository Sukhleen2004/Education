 <script>
async function uploadPdfs() {
  const fileInput = document.getElementById('pdfUpload');
  const files = fileInput.files;
  const grid = document.getElementById('pdfGrid');
  const existingFileNames = Array.from(grid.querySelectorAll('.pdf-name a')).map(a => a.textContent); // Get existing file names

  for (const file of files) {
    const fileName = file.name;

    if (existingFileNames.includes(fileName)) {
      alert(`"${fileName}" already exists. Please upload another file.`);
      continue; // Skip to the next file
    }

    const fileUrl = URL.createObjectURL(file);

    const gridItem = document.createElement('div');
    gridItem.classList.add('grid-item');

    const pdfBox = document.createElement('div');
    pdfBox.classList.add('pdf-box');

    const pdfImage = await generatePdfPreview(fileUrl);
    pdfBox.appendChild(pdfImage);

    const pdfName = document.createElement('div');
    pdfName.classList.add('pdf-name');
    const fileLink = document.createElement('a');
    fileLink.textContent = fileName;
    fileLink.href = fileUrl;
    fileLink.target = "_blank";
    pdfName.appendChild(fileLink);

    gridItem.appendChild(pdfBox);
    gridItem.appendChild(pdfName);
    grid.appendChild(gridItem);
  }
  fileInput.value = '';
}

async function generatePdfPreview(fileURL) {
  const loadingTask = pdfjsLib.getDocument(fileURL);
  const pdf = await loadingTask.promise;
  const page = await pdf.getPage(1);
  const viewport = page.getViewport({ scale: 1 });
  const canvas = document.createElement('canvas');
  const context = canvas.getContext('2d');
  canvas.height = viewport.height;
  canvas.width = viewport.width;

  await page.render({ canvasContext: context, viewport: viewport }).promise;

  const img = document.createElement('img');
  img.src = canvas.toDataURL();
  return img;
}
</script>


<script>
function searchPdfs() {
  const searchTerm = document.getElementById('search-input').value.toLowerCase();
  const pdfItems = document.querySelectorAll('.grid-item');

  pdfItems.forEach(item => {
    const pdfName = item.querySelector('.pdf-name a').textContent.toLowerCase();
    if (pdfName.includes(searchTerm)) {
      item.style.display = 'block';
    } else {
      item.style.display = 'none';
    }
  });

  // Add click event listener to each PDF link
  pdfItems.forEach(item => {
    const pdfLink = item.querySelector('.pdf-name a');
    pdfLink.addEventListener('click', () => {
      document.getElementById('search-input').value = ''; // Clear search input
      displayAllPdfs(); // Display all PDFs again
    });
  });
}

function displayAllPdfs() {
  const pdfItems = document.querySelectorAll('.grid-item');
  pdfItems.forEach(item => {
    item.style.display = 'block'; // Show all items
  });
}
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
